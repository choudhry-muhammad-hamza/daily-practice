  <body>
    <h2>Book Your Vacation</h2>

    <form>
      <!-- Personal Info -->
      <label for="name">Full Name:</label><br />
      <input type="text" id="name" name="name" required /><br /><br />

      <label for="email">Email:</label><br />
      <input type="email" id="email" name="email" required /><br /><br />

      <label for="phone">Phone Number:</label><br />
      <input type="tel" id="phone" name="phone" required /><br /><br />

      <!-- Destination -->
      <label for="destination">Select Destination:</label><br />
      <select id="destination" name="destination">
        <option value="paris">Paris</option>
        <option value="dubai">Dubai</option>
        <option value="maldives">Maldives</option>
        <option value="turkey">Turkey</option></select
      ><br /><br />

      <!-- Dates -->
      <label for="from">Departure Date:</label><br />
      <input type="date" id="from" name="from" /><br /><br />

      <label for="to">Return Date:</label><br />
      <input type="date" id="to" name="to" /><br /><br />

      <!-- Travelers -->
      <label for="people">Number of Travelers:</label><br />
      <input
        type="number"
        id="people"
        name="people"
        min="1"
        max="10"
      /><br /><br />

      <!-- Preferences -->
      <p>Travel Class:</p>
      <input
        type="radio"
        id="economy"
        name="class"
        value="economy"
        style="accent-color: blue"
      />
      <label for="economy">Economy</label>

      <input
        type="radio"
        id="business"
        name="class"
        value="business"
        style="accent-color: rgb(47, 255, 0)"
      />
      <label for="business">Business</label>

      <input
        type="radio"
        id="first"
        name="class"
        value="first"
        style="accent-color: rgb(3, 3, 35)"
      />
      <label for="first">First Class</label>

      <br /><br />

      <!-- Extras -->
      <p>Extra Services:</p>
      <input
        type="checkbox"
        id="meal"
        name="extras"
        value="meal"
        style="accent-color: rgb(232, 30, 255)"
      />
      <label for="meal">Meal Included</label><br />

      <input
        type="checkbox"
        id="pickup"
        name="extras"
        value="pickup"
        style="accent-color: rgb(255, 25, 0)"
      />
      <label for="pickup">Airport Pickup</label><br />

      <input
        type="checkbox"
        id="insurance"
        name="extras"
        value="insurance"
        style="accent-color: rgb(5, 180, 255)"
      />
      <label for="insurance">Travel Insurance</label><br /><br />

      <!-- Submit -->
      <input type="submit" value="Book Now" />
    </form>
